name: Build virt-v2v RPM 2.10.0 for EL9

on:
  push:
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: almalinux:9  #

    steps:
      - name: Install repository configurations
        run: dnf install -y git dnf-plugins-core epel-release 

      - name: Resolve curl-minimal conflicts
        run: |
          dnf swap -y curl-minimal curl
          dnf swap -y libcurl-minimal libcurl

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install basic build tools
        run: |
          dnf config-manager --set-enabled crb
          dnf install -y --allowerasing \
                         rpm-build rpmdevtools git sqlite perl-hivex \
                         autoconf automake libtool curl cpio \
                         ocaml ocaml-findlib-devel 

      - name: Extract Fedora 43 SPEC file
        run: |
          cd /root
          curl -L -o virt-v2v-2.10.0-1.fc43.src.rpm \
            "https://kojipkgs.fedoraproject.org/packages/virt-v2v/2.10.0/1.fc43/src/virt-v2v-2.10.0-1.fc43.src.rpm"
          mkdir -p /tmp/srpm-extract
          cd /tmp/srpm-extract
          rpm2cpio /root/virt-v2v-2.10.0-1.fc43.src.rpm | cpio -idmv

      # CRITICAL STEP: Patch the SPEC file BEFORE dnf builddep
      - name: Patch spec file for EL9 compatibility
        run: |
          SPEC_FILE="/tmp/srpm-extract/virt-v2v.spec"

          # 1. Lower version requirements to match EL9 availability
          sed -i 's/libguestfs-devel >= 1:1.58.0-1/libguestfs-devel >= 1:1.52.0/' $SPEC_FILE
          sed -i 's/libnbd-devel >= 1.22/libnbd-devel >= 1.16/' $SPEC_FILE
          sed -i 's/nbdkit-server >= 1.46.1/nbdkit-server >= 1.38/' $SPEC_FILE
          
          # 2. Remove missing EL9 packages
          sed -i '/BuildRequires:.*libosinfo-devel/d' $SPEC_FILE
          sed -i '/BuildRequires:.*mingw-srvany/d' $SPEC_FILE

          # 3. Disable GPG checks
          sed -i 's/^\([[:space:]]*\)%{gpgverify}/#\1%{gpgverify}/' $SPEC_FILE
          sed -i 's/%global verify_tarball_signature 1/%global verify_tarball_signature 0/' $SPEC_FILE || true

          # 4. Set Version and Release
          sed -i 's/^Version:.*/Version: 2.10.0/' $SPEC_FILE
          sed -i 's/^Release:.*/Release: 1.el9/' $SPEC_FILE 

      - name: Install build dependencies from patched spec
        run: |
          # Now this will succeed because requirements are >= 1.16 instead of 1.22
          dnf builddep -y --allowerasing /tmp/srpm-extract/virt-v2v.spec

      - name: Setup rpmbuild tree
        run: |
          rpmdev-setuptree
          mkdir -p /root/rpmbuild/{SPECS,SOURCES,BUILD,BUILDROOT,RPMS,SRPMS}

      - name: Build custom tarball
        working-directory: ${{ github.workspace }}
        run: |
          # 1. Prepare auxiliary directory
          mkdir -p build-aux
          
          # 2. Run autoreconf to generate scripts into build-aux
          autoreconf -fiv
          
          # 3. CRITICAL: Copy scripts to root and ensure they are executable
          for f in install-sh install.sh missing compile config.guess config.sub; do
            if [ -f "build-aux/$f" ]; then
              cp "build-aux/$f" .
              chmod +x "$f"
            fi
          done
          
          # 4. Run configure and build distribution
          ./configure
          make dist

      - name: Final Move and Build
        run: |
          mv /tmp/srpm-extract/virt-v2v.spec /root/rpmbuild/SPECS/
          cp /tmp/srpm-extract/*.keyring /root/rpmbuild/SOURCES/ 2>/dev/null || true
          cp /tmp/srpm-extract/*.sig /root/rpmbuild/SOURCES/ 2>/dev/null || true
          cp ${{ github.workspace }}/virt-v2v-2.10.0.tar.gz /root/rpmbuild/SOURCES/
          
          cd /root/rpmbuild/SPECS
          rpmbuild -bb \
            --define "_topdir /root/rpmbuild" \
            --define "_unpackaged_files_terminate_build 0" \
            --nocheck \
            virt-v2v.spec

      - name: Upload built RPMs
        uses: actions/upload-artifact@v4
        with:
          name: virt-v2v-2.10.0-el9-rpm
          path: /root/rpmbuild/RPMS/x86_64/*.rpm